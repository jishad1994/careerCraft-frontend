<div class="flex flex-col min-h-screen bg-gray-50">

  <!-- Header -->
  <app-header
    [logoUrl]="logoUrl"
    [logoRoute]="logoRoute"
    [navItems]="navItems"
    [userMenuItems]="userMenuItems"
    [user]="currentUser"
    [showSearch]="true"
    [searchPlaceholder]="'Search candidates, skills...'"
    (search)="onSearch($event)"
    (logout)="onLogout()">
  </app-header>

  <!-- Body -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 flex-shrink-0 sticky top-0 h-screen">
      <app-company-side-bar></app-company-side-bar>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4">
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- Footer -->
  <app-footer
    *ngIf="showFooter"
    [logoUrl]="logoUrl"
    [description]="'Find your suitable candidates or discover top talent. Connecting opportunities with excellence.'"
    [sections]="footerSections"
    [socialLinks]="socialLinks">
  </app-footer>

</div>
