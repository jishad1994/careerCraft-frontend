<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-xl w-full text-center bg-white rounded-2xl shadow-sm border border-gray-200 p-8 sm:p-10">
    <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-blue-50">
      <span class="text-4xl font-bold text-blue-600">404</span>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
      Page not found
    </h1>

    <p class="mt-4 text-gray-600 leading-relaxed">
      The page you are trying to open does not exist, may have been removed,
      or the URL may be incorrect.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a
        routerLink="/home"
        class="w-full sm:w-auto inline-flex justify-center rounded-xl bg-blue-600 px-6 py-3 text-sm font-semibold text-white hover:bg-blue-700 transition"
      >
        Go to Home
      </a>

      <button
        type="button"
        onclick="history.back()"
        class="w-full sm:w-auto inline-flex justify-center rounded-xl border border-gray-300 px-6 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-100 transition"
      >
        Go Back
      </button>
    </div>
  </div>
</section>
