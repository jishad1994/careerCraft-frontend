<div class="flex items-center justify-center min-h-screen bg-gray-50">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Forgot Password
        </h2>

        <form [formGroup]="forgotForm" (ngSubmit)="submit()" class="space-y-5">
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" formControlName="email" placeholder="Enter your registered email"
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900"
                    [class.border-red-500]="email.touched && email.invalid" />
                <div *ngIf="email.touched && email.invalid" class="text-red-600 text-xs mt-1">
                    <span *ngIf="email.errors?.['required']">Email is required</span>
                    <span *ngIf="email.errors?.['email']">Enter a valid email</span>
                </div>
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Select Role</label>
                <div class="flex space-x-6">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" formControlName="role" value="user"
                            class="text-blue-600 focus:ring-blue-500" />
                        <span class="text-gray-700">User</span>
                    </label>

                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" formControlName="role" value="company"
                            class="text-blue-600 focus:ring-blue-500" />
                        <span class="text-gray-700">Company</span>
                    </label>
                </div>

                <div *ngIf="role.touched && role.invalid" class="text-red-600 text-xs mt-1">
                    <span *ngIf="role.errors?.['required']">Role is required</span>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" [disabled]="forgotForm.invalid" class="w-full py-3 px-4 text-white font-medium rounded-lg transition-all duration-200
               bg-blue-600 hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-1
               disabled:bg-gray-400 disabled:cursor-not-allowed">
                Request Reset Password
            </button>
        </form>
    </div>
</div>
