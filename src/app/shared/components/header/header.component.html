<header class="sticky top-0 z-50 w-full bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">

            <!-- Logo -->
            <div class="flex items-center gap-8">

                <a [routerLink]='logoRoute' class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <img appHoverScale *ngIf="logoUrl" [src]="logoUrl" [alt]="logoText" class="h-8 w-auto" />
                    <span class="text-xl font-bold text-gray-900">{{ logoText }}</span>
                </a>

            </div>

            <!-- Search Bar (Centered) -->
            <div *ngIf="showSearch" class="hidden md:flex flex-1 max-w-2xl mx-8">
                <form (ngSubmit)="onSearch()" class="w-full">
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input type="text" [(ngModel)]="searchQuery" name="search" (focus)="isSearchFocused = true"
                            (blur)="isSearchFocused = false" [placeholder]="searchPlaceholder"
                            class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white transition-all"
                            [class.ring-2]="isSearchFocused" [class.ring-blue-500]="isSearchFocused" />
                    </div>
                </form>
            </div>

            <!-- Navigation - Desktop -->
            <nav class="hidden md:flex items-center gap-2">
                <!-- Navigation Items -->
                <ng-container *ngFor="let item of navItems">
                    <a *ngIf="item.route && !item.isPrimary" [routerLink]="item.route" routerLinkActive="text-blue-600"
                        class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 rounded-lg transition-colors">
                        {{ item.label }}
                    </a>

                    <a *ngIf="item.route && item.isPrimary" [routerLink]="item.route"
                        class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">
                        {{ item.label }}
                    </a>

                    <button *ngIf="item.action && !item.route" (click)="handleNavAction(item)"
                        [class.bg-blue-600]="item.isPrimary" [class.text-white]="item.isPrimary"
                        [class.hover:bg-blue-700]="item.isPrimary" [class.text-gray-700]="!item.isPrimary"
                        [class.hover:bg-gray-50]="!item.isPrimary"
                        class="px-4 py-2 text-sm font-medium rounded-lg transition-colors">
                        {{ item.label }}
                    </button>
                </ng-container>

                <!-- User Dropdown (if logged in) -->
                <div *ngIf="user ;else authButtons" class="relative dropdown-container ml-2">
                    <button (click)="toggleUserDropdown()"
                        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors focus:outline-none">
                        <div *ngIf="user.profilePicture; else initials">
                            <img [src]="user.profilePicture.location" [alt]='userName'
                                class="w-8 h-8 rounded-full object-cover" />
                        </div>
                        <ng-template #initials>
                            <div
                                class="w-8 h-8 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white text-sm font-semibold">
                                {{ getUserInitials(user.name??user.firstName) }}
                            </div>
                        </ng-template>
                        <svg class="w-4 h-4 text-gray-600 transition-transform" [class.rotate-180]="isUserDropdownOpen"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <div *ngIf="isUserDropdownOpen"
                        class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50 animate-fadeIn">
                        <!-- User Info -->
                        <div class="px-4 py-3 border-b border-gray-200">
                            <p class="text-sm font-medium text-gray-900">{{ userName}}</p>
                            <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
                        </div>

                        <!-- User Menu Items -->
                        <ng-container *ngFor="let item of userMenuItems">
                            <a *ngIf="item.route" [routerLink]="item.route" (click)="closeUserDropdown()"
                                class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                                <svg *ngIf="item.icon" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        [attr.d]="item.icon"></path>
                                </svg>
                                {{ item.label }}
                            </a>

                            <button *ngIf="item.action && !item.route"
                                (click)="handleNavAction(item); closeUserDropdown()"
                                class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 text-left">
                                <svg *ngIf="item.icon" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        [attr.d]="item.icon"></path>
                                </svg>
                                {{ item.label }}
                            </button>

                            <div *ngIf="item.label === 'divider'" class="border-t border-gray-200 my-1"></div>
                        </ng-container>

                        <!-- Logout Button -->
                        <div class="border-t border-gray-200 my-1"></div>
                        <button *ngIf="user " (click)="onLogout()"
                            class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                            Sign Out
                        </button>

                    </div>
                </div>

                <!-- Login / Signup Buttons -->
                <ng-template #authButtons>
                    <div class="flex items-center gap-2 ml-2">
                        <a routerLink="/auth/login"
                            class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 rounded-lg">
                            Login
                        </a>

                        <a routerLink="/auth/signup"
                            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">
                            Get Started
                        </a>
                    </div>
                </ng-template>



            </nav>

            <!-- Mobile Menu Button -->
            <button (click)="toggleMobileMenu()"
                class="md:hidden p-2 rounded-lg hover:bg-gray-100 mobile-menu-container">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path *ngIf="!showMobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"></path>
                    <path *ngIf="showMobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div *ngIf="showMobileMenu" class="md:hidden border-t border-gray-200 py-4 mobile-menu-container">
            <!-- Mobile Search -->
            <div *ngIf="showSearch && user" class="px-4 mb-4">
                <form (ngSubmit)="onSearch()">
                    <input type="text" [(ngModel)]="searchQuery" name="search" [placeholder]="searchPlaceholder"
                        class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </form>
            </div>

            <!-- Mobile Navigation Links -->
            <nav class="space-y-1 px-2">
                <ng-container *ngFor="let item of navItems">
                    <a *ngIf="item.route && !item.isPrimary" [routerLink]="item.route" (click)="toggleMobileMenu()"
                        class="block px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        {{ item.label }}
                    </a>

                    <a *ngIf="item.route && item.isPrimary" [routerLink]="item.route" (click)="toggleMobileMenu()"
                        class="block px-3 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg text-center">
                        {{ item.label }}
                    </a>

                    <button *ngIf="item.action && !item.route" (click)="handleNavAction(item)"
                        class="w-full text-left px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        {{ item.label }}
                    </button>
                </ng-container>

                <!-- User Menu Items in Mobile -->
                <ng-container *ngIf="user ;else mobileAuth">
                    <div class="border-t border-gray-200 my-2"></div>
                    <ng-container *ngFor="let item of userMenuItems">
                        <a *ngIf="item.route" [routerLink]="item.route" (click)="toggleMobileMenu()"
                            class="block px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                            {{ item.label }}
                        </a>
                        <button *ngIf="item.action && !item.route" (click)="handleNavAction(item)"
                            class="w-full text-left px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                            {{ item.label }}
                        </button>
                    </ng-container>

                    <div class="border-t border-gray-200 my-2"></div>
                    <button (click)="onLogout(); toggleMobileMenu()"
                        class="w-full text-left px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg">
                        Sign Out
                    </button>
                </ng-container>
                <ng-template #mobileAuth>
                    <div class="border-t border-gray-200 my-2"></div>

                    <a routerLink="/auth/login" (click)="toggleMobileMenu()"
                        class="block px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg">
                        Login
                    </a>

                    <a routerLink="/auth/register" (click)="toggleMobileMenu()"
                        class="block px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg text-center">
                        Get Started
                    </a>
                </ng-template>
            </nav>
        </div>
    </div>
</header>
