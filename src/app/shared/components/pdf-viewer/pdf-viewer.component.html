<!-- Resume Viewer Modal -->
<div class="flex flex-col h-full max-h-[90vh]">

  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-white">
    <div class="flex-1">
      <h2 class="text-xl font-semibold text-gray-900">Resume</h2>
      <p class="text-sm text-gray-600 mt-1">
        {{ data.candidateName || 'Candidate' }}
      </p>
    </div>

    <div class="flex items-center gap-2">
      
      <!-- Download Button -->
      <button
        *ngIf="resumeUrl"
        (click)="downloadResume()"
        [disabled]="downloading"
        class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4">
          </path>
        </svg>

        <span>Download</span>
      </button>

      <!-- Close Button -->
      <button
        (click)="close()"
        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">

        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12">
          </path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 bg-gray-100 overflow-hidden">

    <!-- PDF Viewer -->
    <iframe
      *ngIf="resumeUrl"
      [src]="resumeUrl"
      class="w-full h-full border-0 bg-white"
      title="Resume PDF Viewer">
    </iframe>

    <!-- Fallback if no resume -->
    <div
      *ngIf="!resumeUrl"
      class="flex items-center justify-center h-full bg-white text-gray-600">
      Resume not available.
    </div>

  </div>

  <!-- Footer -->
  <div class="px-4 py-3 bg-gray-50 border-t border-gray-200">
    <div class="flex items-center justify-between text-sm">
      <div class="flex items-center gap-2 text-gray-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
          </path>
        </svg>
        <span>{{ fileName }}</span>
      </div>

      <span class="text-gray-500 text-xs">
        Use the download button to save a copy
      </span>
    </div>
  </div>

</div>
