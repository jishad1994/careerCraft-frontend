<!-- reset-password.component.html -->
<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Reset Password
    </h2>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" class="space-y-5">
      <!-- New Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter new password"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900"
          [class.border-red-500]="password.touched && password.invalid"
        />
        <div *ngIf="password.touched && password.invalid" class="text-red-600 text-xs mt-1">
          <span *ngIf="password.errors?.['required']">Password is required</span>
          <span *ngIf="password.errors?.['minlength']">Minimum 6 characters</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter new password"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900"
          [class.border-red-500]="resetForm.hasError('passwordMismatch') && confirmPassword.touched"
        />
        <div *ngIf="resetForm.hasError('passwordMismatch') && confirmPassword.touched" class="text-red-600 text-xs mt-1">
          Passwords do not match
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="resetForm.invalid"
        class="w-full py-3 px-4 text-white font-medium rounded-lg transition-all duration-200
               bg-blue-600 hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-1
               disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        Reset Password
      </button>
    </form>
  </div>
</div>
