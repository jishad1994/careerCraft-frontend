<div class="fixed inset-0 bg-gray-900 flex flex-col">

  <!-- Loading State -->
  <div *ngIf="loading" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-white mx-auto mb-4"></div>
      <p class="text-white text-lg">Connecting to interview...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex-1 flex items-center justify-center">
    <div class="bg-red-100 border border-red-400 text-red-700 px-6 py-4 rounded-lg max-w-md">
      <p class="font-bold mb-2">Connection Error</p>
      <p>{{ error }}</p>
      <button (click)="endCall()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
        Go Back
      </button>
    </div>
  </div>

  <!-- Video Call Interface -->
  <div *ngIf="!loading && !error" class="flex-1 flex flex-col">

    <!-- Top Bar -->
    <div class="bg-gray-800 px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <h1 class="text-white font-semibold">Interview Call</h1>
        <span class="px-3 py-1 bg-gray-700 text-white text-sm rounded-full">
          {{ getFormattedDuration() }}
        </span>
        <span class="px-3 py-1 text-xs rounded-full" [class.bg-green-500]="callState?.connectionStatus === 'connected'"
          [class.bg-yellow-500]="callState?.connectionStatus === 'connecting'"
          [class.bg-red-500]="callState?.connectionStatus === 'failed' || callState?.connectionStatus === 'disconnected'"
          [class.text-white]="true">
          {{ getConnectionStatusText() }}
        </span>
      </div>
    </div>

    <!-- Video Container -->
    <div class="flex-1 relative bg-black">

      <!-- Remote Video (Main) -->
      <!-- <video #remoteVideo
             autoplay
             playsinline
             class="w-full h-full object-contain"></video> -->

      <!-- No Remote Stream Message -->
      <!-- <div *ngIf="!callState?.remoteStream" 
           class="absolute inset-0 flex items-center justify-center">
        <div class="text-center">
          <svg class="w-24 h-24 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <p class="text-gray-400 text-lg">Waiting for other participant...</p>
        </div>
      </div> -->

      <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        <video #remoteVideo autoplay playsinline
          class="max-w-full max-h-full object-contain rounded-lg shadow-md"></video>

        <div *ngIf="!callState?.remoteStream" class="absolute inset-0 flex items-center justify-center">
          <p class="text-gray-400 text-lg">Waiting for other participant...</p>
        </div>
      </div>

      <!-- Local Video (Picture-in-Picture) -->
      <div
        class="absolute top-4 right-4 w-64 h-48 bg-gray-800 rounded-lg overflow-hidden shadow-xl border-2 border-gray-700">
        <!-- <video #localVideo autoplay playsinline muted class="w-full h-full object-cover mirror"></video> -->
        <div
          class="absolute top-4 right-4 w-48 h-36 bg-gray-800 rounded-lg overflow-hidden shadow-xl border-2 border-gray-700">
          <video #localVideo autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
        </div>
        <!-- Local Video Disabled Overlay -->
        <div *ngIf="!callState?.isVideoEnabled" class="absolute inset-0 bg-gray-900 flex items-center justify-center">
          <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>

        <div class="absolute bottom-2 left-2 text-white text-xs bg-black bg-opacity-50 px-2 py-1 rounded">
          You
        </div>
      </div>

    </div>

    <!-- Controls Bar -->
    <div class="bg-gray-800 px-6 py-4">
      <div class="flex items-center justify-center gap-4">

        <!-- Microphone Toggle -->
        <button (click)="toggleAudio()" [class.bg-red-600]="!callState?.isAudioEnabled"
          [class.bg-gray-700]="callState?.isAudioEnabled" [class.hover:bg-red-700]="!callState?.isAudioEnabled"
          [class.hover:bg-gray-600]="callState?.isAudioEnabled"
          class="w-14 h-14 rounded-full flex items-center justify-center text-white transition-colors">
          <svg *ngIf="callState?.isAudioEnabled" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z">
            </path>
          </svg>
          <svg *ngIf="!callState?.isAudioEnabled" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
            </path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
          </svg>
        </button>

        <!-- Video Toggle -->
        <button (click)="toggleVideo()" [class.bg-red-600]="!callState?.isVideoEnabled"
          [class.bg-gray-700]="callState?.isVideoEnabled" [class.hover:bg-red-700]="!callState?.isVideoEnabled"
          [class.hover:bg-gray-600]="callState?.isVideoEnabled"
          class="w-14 h-14 rounded-full flex items-center justify-center text-white transition-colors">
          <svg *ngIf="callState?.isVideoEnabled" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
            </path>
          </svg>
          <svg *ngIf="!callState?.isVideoEnabled" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
          </svg>
        </button>

        <!-- Screen Share Toggle -->
        <button (click)="toggleScreenShare()" [class.bg-blue-600]="callState?.isScreenSharing"
          [class.bg-gray-700]="!callState?.isScreenSharing" [class.hover:bg-blue-700]="callState?.isScreenSharing"
          [class.hover:bg-gray-600]="!callState?.isScreenSharing"
          class="w-14 h-14 rounded-full flex items-center justify-center text-white transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
            </path>
          </svg>
        </button>

        <!-- End Call -->
        <button (click)="endCall()"
          class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center text-white hover:bg-red-700 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z">
            </path>
          </svg>
        </button>

        <!-- End Interview for All (Company only) -->
        <button *ngIf="userRole === 'company'" (click)="endInterviewForAll()"
          class="ml-4 px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition-colors">
          End Interview
        </button>
      </div>
    </div>

  </div>

</div>

<style>
  .mirror {
    transform: scaleX(-1);
  }
</style>
