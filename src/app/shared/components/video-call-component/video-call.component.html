<div class="fixed inset-0 bg-gray-950 flex flex-col">

  <!-- Loading State -->
  <div *ngIf="loading" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-14 w-14 border-2 border-white/20 border-t-white mx-auto mb-4"></div>
      <p class="text-white/70 text-sm tracking-wide">Connecting to interview...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex-1 flex items-center justify-center">
    <div class="bg-red-950/60 border border-red-500/30 text-red-300 px-6 py-5 rounded-xl max-w-md">
      <p class="font-semibold mb-1 text-red-200">Connection Error</p>
      <p class="text-sm text-red-300/80">{{ error }}</p>
      <button (click)="endCall()"
        class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500 text-sm transition-colors">
        Go Back
      </button>
    </div>
  </div>

  <!-- Video Call Interface -->
  <div *ngIf="!loading && !error" class="flex-1 flex flex-col min-h-0">

    <!-- Top Bar -->
    <div class="bg-gray-900/80 backdrop-blur-sm px-5 py-3 flex items-center justify-between border-b border-white/5 shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-white font-medium text-sm">Interview</span>
        <span class="px-2.5 py-0.5 bg-white/10 text-white/70 text-xs rounded-full font-mono">
          {{ getFormattedDuration() }}
        </span>
        <span class="px-2.5 py-0.5 text-xs rounded-full font-medium text-white"
          [ngClass]="{
            'bg-emerald-500': callState?.connectionStatus === 'connected',
            'bg-amber-500':   callState?.connectionStatus === 'connecting',
            'bg-red-500':     callState?.connectionStatus === 'failed' || callState?.connectionStatus === 'disconnected',
            'bg-gray-500':    !callState?.connectionStatus
          }">
          {{ getConnectionStatusText() }}
        </span>
      </div>
    </div>

    <!-- Video Container -->
    <div class="flex-1 relative bg-black min-h-0">

      <!-- Remote Video -->
      <!-- object-cover for camera, object-contain for screen share to avoid cropping -->
      <video #remoteVideo
        autoplay
        playsinline
        class="absolute inset-0 w-full h-full transition-all duration-300"
        [ngClass]="callState?.isScreenSharing ? 'object-contain' : 'object-cover'">
      </video>

      <!-- Waiting overlay -->
      <div *ngIf="!callState?.remoteStream"
        class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950">
        <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mb-4">
          <svg class="w-10 h-10 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <p class="text-white/40 text-sm">Waiting for participant to join...</p>
      </div>

      <!-- Local Video (PiP) — wider during screen share -->
      <div class="absolute top-4 right-4 bg-gray-800 rounded-xl overflow-hidden shadow-2xl border border-white/10 transition-all duration-300"
        [ngClass]="callState?.isScreenSharing ? 'w-72 h-44' : 'w-52 h-40'">

        <video #localVideo
          autoplay
          playsinline
          muted
          class="w-full h-full transition-all duration-300"
          [ngClass]="callState?.isScreenSharing ? 'object-contain' : 'object-cover mirror'">
        </video>

        <!-- Screen sharing badge -->
        <div *ngIf="callState?.isScreenSharing"
          class="absolute top-2 left-2 flex items-center gap-1.5 bg-blue-600/90 text-white text-xs px-2 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
          Sharing
        </div>

        <!-- Camera off overlay (only when not screen sharing) -->
        <div *ngIf="!callState?.isVideoEnabled && !callState?.isScreenSharing"
          class="absolute inset-0 bg-gray-900 flex items-center justify-center">
          <svg class="w-10 h-10 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>

        <div class="absolute bottom-2 left-2 text-white/60 text-xs bg-black/50 px-2 py-0.5 rounded-full">
          You
        </div>
      </div>

    </div>

    <!-- Controls Bar -->
    <div class="bg-gray-900/90 backdrop-blur-sm px-6 py-4 border-t border-white/5 shrink-0">
      <div class="flex items-center justify-center gap-3">

        <!-- Microphone Toggle -->
        <button (click)="toggleAudio()"
          class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-150 hover:opacity-80"
          [class.bg-red-600]="!callState?.isAudioEnabled"
          [class.text-white]="!callState?.isAudioEnabled"
          [class.bg-white]="callState?.isAudioEnabled"
          [class.text-gray-900]="callState?.isAudioEnabled"
          title="Toggle microphone">
          <svg *ngIf="callState?.isAudioEnabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
          <svg *ngIf="!callState?.isAudioEnabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>

        <!-- Video Toggle -->
        <button (click)="toggleVideo()"
          class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-150 hover:opacity-80"
          [class.bg-red-600]="!callState?.isVideoEnabled"
          [class.text-white]="!callState?.isVideoEnabled"
          [class.bg-white]="callState?.isVideoEnabled"
          [class.text-gray-900]="callState?.isVideoEnabled"
          title="Toggle camera">
          <svg *ngIf="callState?.isVideoEnabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <svg *ngIf="!callState?.isVideoEnabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        </button>

        <!-- Screen Share Toggle -->
        <button (click)="toggleScreenShare()"
          class="w-12 h-12 rounded-full flex items-center justify-center text-white transition-all duration-150 hover:opacity-80"
          [ngClass]="callState?.isScreenSharing ? 'bg-blue-500' : 'bg-white/10'"
          title="Share screen">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>

        <!-- End Call -->
        <button (click)="endCall()"
          class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-all duration-150"
          title="Leave call">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z" />
          </svg>
        </button>

        <!-- End Interview for All (Company only) -->
        <button *ngIf="userRole === 'company'" (click)="endInterviewForAll()"
          class="ml-2 px-5 py-2.5 bg-red-600/20 border border-red-500/40 text-red-400 rounded-lg hover:bg-red-600 hover:text-white text-sm font-medium transition-all duration-150">
          End for All
        </button>

      </div>
    </div>

  </div>

</div>

<style>
  .mirror {
    transform: scaleX(-1);
  }
</style>
