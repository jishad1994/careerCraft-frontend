<footer class="bg-white border-t border-gray-200 mt-auto">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-8 lg:gap-12">
      
      <!-- Brand Section -->
      <div class="lg:col-span-2">
        <div class="flex items-center gap-2 mb-4">
          <img *ngIf="logoUrl" [src]="logoUrl" [alt]="companyName" class="h-8 w-auto" />
          <span class="text-xl font-bold text-gray-900">{{ logoText || companyName }}</span>
        </div>
        <p class="text-sm text-gray-600 mb-6 max-w-sm">
          {{ description }}
        </p>
        
        <!-- Social Links -->
        <div class="flex items-center gap-4">
          <a *ngFor="let social of socialLinks" 
             [href]="social.url" 
             target="_blank"
             rel="noopener noreferrer"
             [attr.aria-label]="social.label"
             class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path [attr.d]="social.icon"></path>
            </svg>
          </a>
        </div>
      </div>

      <!-- Link Sections -->
      <div *ngFor="let section of sections" class="space-y-4">
        <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-wider">
          {{ section.title }}
        </h3>
        <ul class="space-y-3">
          <li *ngFor="let link of section.links">
            <a *ngIf="link.route" 
               [routerLink]="link.route"
               class="text-sm text-gray-600 hover:text-blue-600 transition-colors">
              {{ link.label }}
            </a>
            <a *ngIf="link.url && !link.route" 
               [href]="link.url"
               target="_blank"
               rel="noopener noreferrer"
               class="text-sm text-gray-600 hover:text-blue-600 transition-colors">
              {{ link.label }}
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="mt-12 pt-8 border-t border-gray-200">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-gray-500">
          © {{ copyrightYear || currentYear }} {{ companyName }}. All rights reserved.
        </p>
        <div class="flex items-center gap-6">
          <a routerLink="/privacy" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
            Privacy Policy
          </a>
          <a routerLink="/terms" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
            Terms of Service
          </a>
          <a routerLink="/cookies" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
            Cookie Policy
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
