<!-- login Box -->
<div class="flex flex-col flex-grow items-center justify-center ">
    <div class="w-full max-w-md z-10">
        <div class="glass-effect rounded-2xl p-8 shadow-xl hover-lift">


           
            <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg space-y-6">
                <div class="px-6 py-6 border-b border-gray-100 bg-gray-50">
                    <h2 class="text-2xl font-semibold text-gray-900 text-center">Hello</h2>
                    <p class="text-xl font-semibold text-gray-900 text-center">Login to get Strarted</p>
                </div>

                <div class="px-6 py-6">
                    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-5">
                        <!-- Email Field -->
                        <div class="space-y-2">
                            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input id="email" type="email" formControlName="email" placeholder="Enter your email"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                                [class.border-red-500]="email.touched && email.invalid"
                                [class.bg-red-50]="email.touched && email.invalid"
                                [class.focus:ring-red-500]="email.touched && email.invalid"
                                [class.focus:border-red-500]="email.touched && email.invalid" />
                            <div *ngIf="email.touched && email.invalid" class="text-red-600 text-xs mt-1">
                                <div *ngIf="email.errors?.['required']">Email is required.</div>
                                <div *ngIf="email.errors?.['email']">Please enter a valid email address.</div>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="space-y-2">
                            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input id="password" type="password" formControlName="password" noSpace
                                placeholder="Enter your password"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                                [class.border-red-500]="password.touched && password.invalid"
                                [class.bg-red-50]="password.touched && password.invalid"
                                [class.focus:ring-red-500]="password.touched && password.invalid"
                                [class.focus:border-red-500]="password.touched && password.invalid" />
                            <div *ngIf="password.touched && password.invalid" class="text-red-600 text-xs mt-1">
                                <div *ngIf="password.errors?.['required']">Password is required.</div>
                                <div *ngIf="password.errors?.['noSpace']">Password should not have any spaces   .</div>
                                <div *ngIf="password.errors?.['pattern']">
                                    Password must contain at least one uppercase letter, one lowercase letter, and one
                                    number.
                                </div>
                            </div>
                        </div>

                        <!-- Role Selection -->
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center space-x-2">
                                <input type="radio" formControlName="role" value="user" />
                                <span>User</span>
                            </label>
                            <label class="flex items-center space-x-2">
                                <input type="radio" formControlName="role" value="company" />
                                <span>Company</span>
                            </label>
                        </div>


                        <!-- Submit Button -->
                        <button type="submit"
                            class="w-full py-3 px-4 mt-6 text-white font-medium text-base rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
                            [class.bg-blue-600]="loginForm.valid" [class.hover:bg-blue-700]="loginForm.valid"
                            [class.focus:ring-blue-500]="loginForm.valid" [class.transform]="loginForm.valid"
                            [class.hover:-translate-y-0.5]="loginForm.valid" [class.hover:shadow-lg]="loginForm.valid"
                            [class.bg-gray-400]="loginForm.invalid" [class.cursor-not-allowed]="loginForm.invalid"
                            [disabled]="loginForm.invalid">
                            {{ loading ? 'Logging in...' : 'Login' }}
                        </button>

                    </form>
                </div>
            </div>
            <!-- Divider -->
            <div class="relative mb-6 mt-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">or</span>
                </div>
            </div>

            <!-- Social Signup Buttons -->
            <div class="space-y-3 mb-6">
                <button (click)="handleGoogleLogin()" id="google-login-btn"
                    class="social-btn w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 text-gray-700 font-medium">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google"
                        class="w-5 h-5 mr-3">
                    Continue with Google
                </button>
            </div>

            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Do not have an account?
                    <a routerLink="/auth/signup" class="text-blue-600 hover:underline font-medium">Signup</a>
                </p>
            </div>
            <div class="text-center mt-6">
                <p class="text-gray-600">
                    forgot password?
                    <a routerLink="/auth/forgotPassword" class="text-blue-600 hover:underline  font-medium ">reset</a>
                </p>
            </div>
        </div>
    </div>
</div>
