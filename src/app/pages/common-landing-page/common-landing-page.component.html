<app-header></app-header>
<div class="min-h-screen bg-gradient-to-b from-slate-50 to-white">
  <!-- Hero Banner -->
  <section class="relative bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-700 text-white py-20 overflow-hidden">
    <div class="absolute inset-0 bg-black opacity-10"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="text-center mb-12">
        <h1 class="text-5xl md:text-6xl font-bold mb-6">Find Your Dream Job Today</h1>
        <p class="text-xl md:text-2xl text-blue-100 mb-8">
          Connect with top companies and discover opportunities that match your skills
        </p>
      </div>

  <!-- Categories -->
  <section class="bg-gray-50 py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-12">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Browse by Category</h2>
        <p class="text-gray-600">Explore jobs by industry and field</p>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <div *ngFor="let category of categories"
          class="bg-white rounded-xl p-6 hover:shadow-lg transition cursor-pointer text-center border border-gray-100">
          <div class="text-4xl mb-3">{{ category.icon }}</div>
          <h3 class="font-semibold text-gray-900 mb-1">{{ category.name }}</h3>
          <p class="text-sm text-gray-500">{{ category.count }} jobs</p>
        </div>
      </div>
    </div>
  </section>
</div>



<app-footer ></app-footer>
