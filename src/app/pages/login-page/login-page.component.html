<div class="min-h-screen grid lg:grid-cols-2 relative">

    <!-- Logo (Top-Left Corner) -->
    <div class="fixed top-4 sm:top-6 left-4 sm:left-6 z-10">
        <div class="flex items-center space-x-2">
            <img class="w-24 sm:w-28 lg:w-30 ml-2 sm:ml-5" [src]="logoUrl" alt="logo">
        </div>
    </div>

    <!-- left banner -->
    <div class="hidden lg:flex sticky top-0 h-screen items-center justify-center bg-gray-50 z-0">
        <div class="w-4/5 h-auto aspect-square max-h-[600px] bg-center bg-no-repeat bg-contain rounded-xl shadow-2xl flex items-center justify-center text-white text-xl font-bold"
            [style.background-image]="'url(assets/images/login-banner.svg)'">
        </div>
    </div>

    <!-- Right login -->
    <div class="flex flex-col min-h-screen lg:h-screen overflow-y-auto bg-gray-50 p-4 sm:p-6 lg:p-8">

        <!-- signup component -->
        <app-login (formSubmit)="handleLogin($event)" [loading]="loading" (googleLogin)="initGoogleLogin($event)"></app-login>

        <!-- Footer  -->
        <footer class="mt-auto pt-8 pb-4 border-t border-gray-200">
            <!-- Mobile Footer (2 rows) -->
            <div class="flex flex-col gap-3 sm:hidden text-gray-600 text-xs text-center">
                <div class="flex justify-center gap-3">
                    <a href="#" class="hover:underline hover:text-blue-600">About Us</a>
                    <span class="text-gray-400">•</span>
                    <a href="#" class="hover:underline hover:text-blue-600">Contact Us</a>
                    <span class="text-gray-400">•</span>
                    <a href="#" class="hover:underline hover:text-blue-600">FAQs</a>
                </div>
                <div class="flex justify-center gap-3">
                    <a href="#" class="hover:underline hover:text-blue-600">Terms</a>
                    <span class="text-gray-400">•</span>
                    <a href="#" class="hover:underline hover:text-blue-600">Privacy</a>
                    <span class="text-gray-400">•</span>
                    <a href="#" class="hover:underline hover:text-blue-600">Report</a>
                </div>
            </div>

            <!-- Tablet/Desktop Footer (1 row) -->
            <div class="hidden sm:flex flex-wrap justify-center gap-3 md:gap-4 lg:gap-6 text-gray-600 text-xs sm:text-sm">
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">About Us</a>
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">Contact Us</a>
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">FAQs</a>
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">Terms and Conditions</a>
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">Report a Problem</a>
                <a href="#" class="hover:underline hover:text-blue-600 transition-colors">Privacy Policy</a>
            </div>
        </footer>
    </div>

</div>
