  <div class="container mx-auto px-4 py-8">
      <app-reusable-table
        [title]="title"
        [columns]="columns"
        [data]="users"
        [actions]="actions"
        [pagination]="pagination"
        [loading]="loading"
        (pageChange)="onPageChange($event)"
        (searchChange)="onSearch($event)"
        (actionClick)="onActionClick($event)">
      </app-reusable-table>
    </div>
