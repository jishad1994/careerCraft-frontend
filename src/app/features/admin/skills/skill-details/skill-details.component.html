<div class="p-6 space-y-4" *ngIf="skill">

  <h2 class="text-xl font-bold">Skill Details</h2>

  <label for="skillName">Name</label>
  <input id="skillName" class="border p-2 w-full" [(ngModel)]="skill.name" />

  <label for="skillDescription">Description</label>
  <textarea id="skillDescription" class="border p-2 w-full" rows="3" [(ngModel)]="skill.description"></textarea>

  <div class="flex space-x-4 mt-4">
    <button class="bg-blue-600 text-white px-4 py-2 rounded" (click)="saveChanges()">
      Save
    </button>

    <button
      class="px-4 py-2 rounded"
      [class.bg-yellow-600]="!skill.blocked"
      [class.bg-green-600]="skill.blocked"
      (click)="toggleBlock()"
    >
      {{ skill.blocked ? "Unblock" : "Block" }}
    </button>

    <button class="bg-red-600 text-white px-4 py-2 rounded" (click)="deleteSkill()">
      Delete
    </button>
    <button class="bg-blue-600 text-white px-4 py-2 rounded" (click)="goBack()">
      Back
    </button>
  </div>

</div>
