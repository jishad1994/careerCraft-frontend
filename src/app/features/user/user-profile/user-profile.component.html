<div class="min-h-screen bg-gray-50 py-4 sm:py-6 lg:py-8">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Loading State -->
        <div *ngIf="loading && !profile" class="flex items-center justify-center min-h-[400px]">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>

        <!-- Profile Content -->
        <div *ngIf="profile" class="space-y-4">

            <!-- Basic Profile Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-basic-profile [profile]="profile" (updatedBasicInfo)="onUpdated($event)"></app-basic-profile>
                </div>
            </div>

           

            <!-- Education Section Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-education-section [profile]="profile" (updatedEducation)="onUpdated($event)"></app-education-section>
                </div>
            </div>

            <!-- Skills Section Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-skills-section [profile]="profile" (updatedUser)="onUpdated($event)"></app-skills-section>
                </div>
            </div>

            <!-- Experience Section Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-experience-section [profile]="profile" (updatedExperience)="onUpdated($event)"></app-experience-section>
                </div>
            </div>
             <!-- Resume Section Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-resume-section [profile]="profile" (updatedProfile)="onUpdated($event)"></app-resume-section>
                </div>
            </div>

            <!-- Documents Section Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-4 sm:p-6">
                    <app-document-section [profile]="profile" (updatedProfile)="onUpdated($event)"></app-document-section>
                </div>
            </div>

        </div>
    </div>
</div>
