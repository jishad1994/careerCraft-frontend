<div class="min-h-screen bg-gray-100 py-8">
    <div class="max-w-4xl mx-auto px-4">

        <!-- Loading State -->
        <div *ngIf="loading && !profile" class="flex items-center justify-center min-h-[400px]">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>

        <!-- Profile Content -->
        <div *ngIf="profile" class="space-y-4">

            <!-- Header Card -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <!-- Cover Photo -->
                <div class="h-32 bg-gradient-to-r from-blue-500 to-blue-600"></div>

                <!-- Profile Info -->
                <div class="px-6 pb-6">
                    <!-- Profile Picture -->
                    <div class="relative -mt-16 mb-4">
                        <div class="relative inline-block">
                            <div class="w-32 h-32 rounded-full border-4 border-white overflow-hidden bg-white">
                                <img *ngIf="profile.profilePicture" [src]="profile.profilePicture.location"
                                    [alt]="profile.firstName" class="w-full h-full object-cover">
                                <div *ngIf="!profile.profilePicture"
                                    class="w-full h-full bg-blue-600 flex items-center justify-center text-white text-3xl font-semibold">
                                    {{ getInitials() }}
                                </div>
                            </div>

                            <!-- Edit Picture Button -->
                            <button *ngIf="!editMode" (click)="toggleImageMenu()" [disabled]="uploadingImage"
                                class="absolute bottom-0 right-0 bg-white rounded-full p-2 shadow-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
                                <svg *ngIf="!uploadingImage" class="w-5 h-5 text-gray-700" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                <div *ngIf="uploadingImage"
                                    class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
                            </button>

                            <!-- Image Menu -->
                            <div *ngIf="showImageMenu"
                                class="absolute top-full left-0 mt-2 bg-white rounded-lg shadow-xl py-2 min-w-[180px] z-10">
                                <button (click)="onSelectImage()"
                                    class="w-full px-4 py-2 text-left hover:bg-gray-100 flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                    {{ profile.profilePicture ? 'Change Photo' : 'Upload Photo' }}
                                </button>
                                <button *ngIf="profile.profilePicture" (click)="deleteProfilePicture()"
                                    class="w-full px-4 py-2 text-left hover:bg-red-50 text-red-600 flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                        </path>
                                    </svg>
                                    Delete Photo
                                </button>
                                <button (click)="toggleImageMenu()"
                                    class="w-full px-4 py-2 text-left hover:bg-gray-100 text-gray-600 border-t">
                                    Cancel
                                </button>
                            </div>

                            <input type="file" id="profilePictureInput" accept="image/*"
                                (change)="onFileSelected($event)" class="hidden">
                        </div>
                    </div>



                    <app-basic-profile [profile]="profile"
                        (updatedBasicInfo)="onBasicInfoUpdated($event)"></app-basic-profile>

                    <app-education-section [profile]="profile"
                        (updatedEducation)="onEducationUpdated($event)"></app-education-section>

                    <!-- Skills Section -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-semibold text-gray-900">Skills</h2>
                            <button *ngIf="editMode" (click)="addSkill()"
                                class="text-blue-600 hover:text-blue-700 flex items-center gap-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4">
                                    </path>
                                </svg>
                                Add Skill
                            </button>
                        </div>

                        <div *ngIf="!editMode && profile.skills.length > 0" class="flex flex-wrap gap-2">
                            <span *ngFor="let skill of profile.skills"
                                class="px-4 py-2 bg-blue-50 text-blue-700 rounded-full text-sm font-medium">
                                {{ skill.name }}
                            </span>
                        </div>

                        <div *ngIf="!editMode && profile.skills.length === 0" class="text-gray-500">
                            No skills added yet.
                        </div>

                        <div *ngIf="editMode" [formGroup]="profileForm">
                            <div formArrayName="skills" class="space-y-2">
                                <div *ngFor="let skill of skills.controls; let i = index" [formGroupName]="i"
                                    class="flex gap-2">
                                    <input type="text" formControlName="name" placeholder="Skill name"
                                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <button type="button" (click)="removeSkill(i)"
                                        class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                            </path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Experience Section -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-semibold text-gray-900">Experience</h2>
                            <button *ngIf="editMode" (click)="addExperience()"
                                class="text-blue-600 hover:text-blue-700 flex items-center gap-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4">
                                    </path>
                                </svg>
                                Add Experience
                            </button>
                        </div>

                        <!-- View Mode -->
                        <div *ngIf="!editMode" class="space-y-6">
                            <div *ngFor="let exp of profile.experience" class="flex gap-4">
                                <div
                                    class="flex-shrink-0 w-12 h-12 bg-gray-100 rounded flex items-center justify-center">
                                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-semibold text-gray-900">{{ exp.jobTitle }}</h3>
                                    <p class="text-gray-600">{{ exp.company }}</p>
                                    <p class="text-sm text-gray-500 mt-1">
                                        {{ formatDate(exp.startDate) }} - {{ exp.isCurrent ? 'Present' :
                                        formatDate(exp.endDate!) }}
                                    </p>
                                    <p *ngIf="exp.description" class="text-gray-700 mt-2">{{ exp.description }}</p>
                                </div>
                            </div>
                            <div *ngIf="profile.experience.length === 0" class="text-gray-500">
                                No experience added yet.
                            </div>
                        </div>

                        <!-- Edit Mode -->
                        <div *ngIf="editMode" [formGroup]="profileForm">
                            <div formArrayName="experience" class="space-y-4">
                                <div *ngFor="let exp of experienceList.controls; let i = index" [formGroupName]="i"
                                    class="p-4 border border-gray-200 rounded-lg space-y-3">
                                    <div class="flex justify-between items-start">
                                        <h3 class="font-medium text-gray-900">Experience #{{ i + 1 }}</h3>
                                        <button type="button" (click)="removeExperience(i)"
                                            class="text-red-600 hover:text-red-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M6 18L18 6M6 6l12 12"></path>
                                            </svg>
                                        </button>
                                    </div>

                                    <input type="text" formControlName="jobTitle" placeholder="Job Title *"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <input type="text" formControlName="company" placeholder="Company *"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">

                                    <div class="grid grid-cols-2 gap-3">
                                        <input type="month" formControlName="startDate" placeholder="Start Date"
                                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        <input type="month" formControlName="endDate" placeholder="End Date"
                                            [disabled]="exp.get('isCurrent')?.value"
                                            class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100">
                                    </div>

                                    <label class="flex items-center gap-2">
                                        <input type="checkbox" formControlName="isCurrent"
                                            class="rounded text-blue-600">
                                        <span class="text-sm text-gray-700">I currently work here</span>
                                    </label>

                                    <textarea formControlName="description" rows="3" placeholder="Description"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    

                </div>
            </div>
        </div>
