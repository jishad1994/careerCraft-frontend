<div class="space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <h2 class="text-lg sm:text-xl font-semibold text-gray-900">Resumes</h2>
        <button 
            (click)="onSelectResume()" 
            [disabled]="uploadingDocument"
            class="px-3 sm:px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2">
            <svg *ngIf="!uploadingDocument" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <div *ngIf="uploadingDocument" class="animate-spin rounded-full h-4 w-4 sm:h-5 sm:w-5 border-b-2 border-white"></div>
            <span class="hidden sm:inline">Upload Resume</span>
            <span class="sm:hidden">Upload</span>
        </button>
        <input 
            type="file" 
            id="documentInput" 
            accept=".pdf,.jpg,.jpeg,.png" 
            (change)="onResumeSelected($event)"
            class="hidden">
    </div>

    <!-- Helper Text -->
    <p class="text-xs sm:text-sm text-gray-500">Accepted formats: PDF, JPEG, PNG (Max 10MB)</p>

    <!-- Resumes Grid -->
    <div *ngIf="profile && profile.resumeURL.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
        <div *ngFor="let doc of profile.resumeURL"
            class="flex items-center justify-between p-3 sm:p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
            <div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
                <!-- Document Icon -->
                <div class="flex-shrink-0">
                    <!-- PDF Icon with "PDF" text -->
                    <div *ngIf="getDocumentIcon(doc) === 'pdf'" 
                         class="w-10 h-10 sm:w-12 sm:h-12 bg-red-50 border-2 border-red-200 rounded-lg flex items-center justify-center">
                        <span class="text-red-600 font-bold text-xs sm:text-sm">PDF</span>
                    </div>
                    
                    <!-- Image Icon -->
                    <div *ngIf="getDocumentIcon(doc) === 'image'" 
                         class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-50 border-2 border-blue-200 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Document Name & Actions -->
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate">{{ getDocumentName(doc) }}</p>
                    <button 
                        (click)="viewResume(doc)"
                        class="text-xs sm:text-sm text-blue-600 hover:text-blue-700 hover:underline font-medium">
                        View Resume
                    </button>
                </div>
            </div>

            <!-- Delete Button -->
            <button 
                (click)="deleteResume(doc.key)" 
                class="flex-shrink-0 ml-2 sm:ml-4 p-1.5 sm:p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                aria-label="Delete resume">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="profile && profile.resumeURL.length === 0" class="text-center py-8 sm:py-12">
        <svg class="w-12 h-12 sm:w-16 sm:h-16 mx-auto text-gray-400 mb-3 sm:mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <p class="text-sm sm:text-base text-gray-500 font-medium">No resumes uploaded yet</p>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">Upload your resume to get started with job applications</p>
    </div>
</div>
