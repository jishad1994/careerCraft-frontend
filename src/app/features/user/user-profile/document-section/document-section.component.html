<div class="space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <h2 class="text-lg sm:text-xl font-semibold text-gray-900">Documents & Certifications</h2>
        <button 
            (click)="onSelectDocument()" 
            [disabled]="uploadingDocument"
            class="px-3 sm:px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2">
            <svg *ngIf="!uploadingDocument" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <div *ngIf="uploadingDocument" class="animate-spin rounded-full h-4 w-4 sm:h-5 sm:w-5 border-b-2 border-white"></div>
            <span class="hidden sm:inline">Upload Document</span>
            <span class="sm:hidden">Upload</span>
        </button>
        <input 
            type="file" 
            id="documentInput" 
            accept=".pdf,.jpg,.jpeg,.png" 
            (change)="onDocumentSelected($event)" 
            class="hidden">
    </div>

    <!-- Helper Text -->
    <p class="text-xs sm:text-sm text-gray-500">Accepted formats: PDF, JPEG, PNG (Max 10MB)</p>

    <!-- Documents Grid -->
    <div *ngIf="profile && profile.certificates.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
        <div *ngFor="let doc of profile.certificates"
            class="flex items-center justify-between p-3 sm:p-4 bg-white border border-gray-200 rounded-lg hover:shadow-md transition-all group">
            <div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
                <!-- Document Icon -->
                <div class="flex-shrink-0">
                    <!-- PDF Icon -->
                    <div *ngIf="getDocumentIcon(doc) === 'pdf'" 
                         class="w-10 h-10 sm:w-12 sm:h-12 bg-orange-50 border-2 border-orange-200 rounded-lg flex items-center justify-center">
                        <span class="text-orange-600 font-bold text-xs sm:text-sm">PDF</span>
                    </div>
                    
                    <!-- Image Icon -->
                    <div *ngIf="getDocumentIcon(doc) === 'image'" 
                         class="w-10 h-10 sm:w-12 sm:h-12 bg-green-50 border-2 border-green-200 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Document Name & Action -->
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-gray-900 truncate group-hover:text-blue-700 transition-colors">
                        {{ getDocumentName(doc) }}
                    </p>
                    <button 
                        (click)="viewDocument(doc)"
                        class="text-xs sm:text-sm text-blue-600 hover:text-blue-700 hover:underline font-medium">
                        View Document
                    </button>
                </div>
            </div>

            <!-- Delete Button -->
            <button 
                (click)="deleteDocument(doc.key)" 
                class="flex-shrink-0 ml-2 sm:ml-4 p-1.5 sm:p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors opacity-0 group-hover:opacity-100"
                aria-label="Delete document">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="profile && profile.certificates.length === 0" class="text-center py-8 sm:py-12">
        <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 sm:w-10 sm:h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
        </div>
        <p class="text-sm sm:text-base text-gray-500 font-medium">No documents uploaded yet</p>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">Upload certifications, licenses, or professional documents</p>
    </div>
</div>
