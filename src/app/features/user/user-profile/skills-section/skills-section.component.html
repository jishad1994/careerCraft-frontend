<div class="bg-white rounded-lg shadow-sm p-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-900">Skills</h2>
    </div>

    <!-- Skills Display -->
    <div *ngIf=" profile&& profile.skills.length > 0" class="flex flex-wrap gap-2 mb-4">
        <span *ngFor="let skill of profile.skills"
            class="px-4 py-2 bg-blue-50 text-blue-700 rounded-full text-sm font-medium flex items-center gap-2">
            {{ skill.name }}
            <button (click)="removeSkill(skill.id)" class="hover:text-red-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </span>
    </div>

    <!-- Skills Search -->
    <div class="relative">
        <input type="text" [(ngModel)]="skillsSearchQuery" (input)="searchSkills(skillsSearchQuery)"
            placeholder="Search and add skills..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">

        <!-- Search Results -->
        <div *ngIf="searchResults.length > 0"
            class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
            <button *ngFor="let skill of searchResults" (click)="addSkill(skill._id)"
                class="w-full px-4 py-2 text-left hover:bg-gray-100 flex items-center justify-between">
                <span>{{ skill.name }}</span>
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
