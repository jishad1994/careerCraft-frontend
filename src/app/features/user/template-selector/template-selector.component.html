<div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Resume Template
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button
                    *ngFor="let template of templates"
                    type="button"
                    (click)="onSelect(template.id)"
                    class="relative p-4 rounded-lg border-2 text-left transition-all duration-150"
                    [ngClass]="{
                        'border-blue-500 bg-blue-50 ring-1 ring-blue-500':
                            selectedId === template.id,
                        'border-gray-200 hover:border-gray-300 bg-white':
                            selectedId !== template.id
                    }"
                >
                    <!-- Selected indicator -->
                    <div
                        *ngIf="selectedId === template.id"
                        class="absolute top-2 right-2 w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center"
                    >
                        <svg
                            class="w-3 h-3 text-white"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="3"
                                d="M5 13l4 4L19 7"
                            />
                        </svg>
                    </div>
 
                    <!-- Template mini-preview icon -->
                    <div
                        class="w-full h-16 rounded mb-3 flex items-center justify-center"
                        [ngClass]="{
                            'bg-amber-50': template.id === 'classic',
                            'bg-blue-50': template.id === 'modern',
                            'bg-gray-50': template.id === 'minimal'
                        }"
                    >
                        <!-- Classic icon -->
                        <svg
                            *ngIf="template.id === 'classic'"
                            class="w-8 h-8 text-amber-600"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                            />
                        </svg>
                        <!-- Modern icon -->
                        <svg
                            *ngIf="template.id === 'modern'"
                            class="w-8 h-8 text-blue-600"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"
                            />
                        </svg>
                        <!-- Minimal icon -->
                        <svg
                            *ngIf="template.id === 'minimal'"
                            class="w-8 h-8 text-gray-500"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M4 6h16M4 12h16M4 18h7"
                            />
                        </svg>
                    </div>
 
                    <h3
                        class="text-sm font-semibold mb-0.5"
                        [ngClass]="{
                            'text-blue-700': selectedId === template.id,
                            'text-gray-900': selectedId !== template.id
                        }"
                    >
                        {{ template.name }}
                    </h3>
                    <p class="text-xs text-gray-500 leading-relaxed">
                        {{ template.description }}
                    </p>
                </button>
            </div>
        </div>
