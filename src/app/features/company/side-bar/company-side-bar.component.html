<aside
  class="fixed lg:relative inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out lg:translate-x-0"
  [class.-translate-x-full]="!isMobileMenuOpen && !isDesktop"
  [class.translate-x-0]="isMobileMenuOpen"
  [class.w-64]="!collapsed"
  [class.w-20]="collapsed"
>
  <!-- Mobile Overlay -->
  <div 
    *ngIf="isMobileMenuOpen" 
    (click)="closeMobileMenu()"
    class="fixed inset-0 bg-gray-600 bg-opacity-75 lg:hidden"
    style="z-index: -1;">
  </div>

  <!-- Sidebar Content -->
  <div class="h-full bg-white border-r border-gray-200 flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-4 border-b border-gray-200">
      <span *ngIf="!collapsed" class="text-lg font-bold text-gray-900">Company</span>
      <button
        (click)="toggleSidebar()"
        class="p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Menu -->
    <nav class="flex-1 overflow-y-auto p-4">
      <ul class="space-y-1">

        <!-- Dashboard -->
        <li>
          <a
            routerLink="/company/dashboard"
            (click)="closeMobileMenu()"
            routerLinkActive="bg-blue-50 text-blue-700"
            [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors group"
          >
            <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span *ngIf="!collapsed" class="text-sm font-medium">Dashboard</span>
          </a>
        </li>

        <!-- Profile -->
        <li>
          <a
            routerLink="/company/dashboard/profile"
            (click)="closeMobileMenu()"
            routerLinkActive="bg-blue-50 text-blue-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors group"
          >
            <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
            <span *ngIf="!collapsed" class="text-sm font-medium">Profile</span>
          </a>
        </li>

        <!-- Job Management -->
        <li>
          <button
            (click)="toggleJobMenu()"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors group"
          >
            <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            <span *ngIf="!collapsed" class="flex-1 text-left text-sm font-medium">Job Management</span>
            <svg *ngIf="!collapsed" class="w-4 h-4 transition-transform" [class.rotate-180]="jobMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Submenu -->
          <ul *ngIf="jobMenuOpen && !collapsed" class="mt-1 ml-11 space-y-1">
            <li>
              <a
                routerLink="/company/dashboard/jobs/create"
                (click)="closeMobileMenu()"
                routerLinkActive="text-blue-700 font-semibold"
                class="block px-4 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-colors"
              >
                Post New Job
              </a>
            </li>
            <li>
              <a
                routerLink="/company/dashboard/jobs"
                (click)="closeMobileMenu()"
                routerLinkActive="text-blue-700 font-semibold"
                class="block px-4 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-colors"
              >
                Active Jobs
              </a>
            </li>
            <li>
              <a
                routerLink="/company/dashboard/jobs/manage"
                (click)="closeMobileMenu()"
                routerLinkActive="text-blue-700 font-semibold"
                class="block px-4 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-colors"
              >
                Manage Jobs
              </a>
            </li>
          </ul>
        </li>

       

        <!-- Interview Management -->
        <li>
          <a
            routerLink="/company/dashboard/interviews"
            (click)="closeMobileMenu()"
            routerLinkActive="bg-blue-50 text-blue-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors group"
          >
            <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span *ngIf="!collapsed" class="text-sm font-medium">Manage Interviews</span>
          </a>
        </li>

        <!-- Settings -->
        <li>
          <a
            routerLink="/company/settings"
            (click)="closeMobileMenu()"
            routerLinkActive="bg-blue-50 text-blue-700"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors group"
          >
            <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span *ngIf="!collapsed" class="text-sm font-medium">Settings</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-gray-200">
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span *ngIf="!collapsed" class="text-sm font-medium">Logout</span>
      </button>
    </div>

  </div>
</aside>
